# =========================================================================
# Render Deployment Blueprint Configuration
# Reference: https://render.com/docs/blueprints
# =========================================================================
services:
  # CogniMirror Backend Service
  - type: web
    name: cognimirror-backend
    env: python
    # Build and run inside the backend/ directory
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free # Can be updated to starter/pro as required
    envVars:
      - key: SECRET_KEY
        # Auto-generate a secure random 32-character key if not manually set
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # User will input this manually in Render Dashboard
      - key: SARVAM_API_KEY
        sync: false # User will input this manually in Render Dashboard
      - key: DATABASE_URL
        sync: false # PostgreSQL connection string (e.g. from Supabase)
      - key: BACKEND_CORS_ORIGINS
        value: https://localhost:3000 # Update this to your frontend Vercel deployment URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
